services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATA_DIRECTORY: /app/data
      AUTH_COOKIE_SECURE: "true"
    volumes:
      - xrc_data:/app/data
    expose:
      - "3000"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  xrc_data:
  caddy_data:
  caddy_config:
