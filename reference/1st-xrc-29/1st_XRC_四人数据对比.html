  <style>
    :root { --ink:#20252b; --muted:#69717b; --line:#dfe3e7; --soft:#f4f6f7; --paper:#ffffff; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#eef1f2; font-family:Inter,"Noto Sans SC","Microsoft YaHei",Arial,sans-serif; letter-spacing:0; }
    header { background:#fff; border-bottom:1px solid var(--line); }
    .header-inner, .section-inner { width:min(1180px, calc(100% - 40px)); margin:0 auto; }
    .header-inner { min-height:88px; display:flex; align-items:center; justify-content:space-between; gap:24px; }
    h1 { margin:0; font-size:26px; line-height:1.2; font-weight:760; }
    .meta { color:var(--muted); font-size:13px; text-align:right; line-height:1.6; }
    .player-key { display:flex; flex-wrap:wrap; gap:18px; padding:0 0 18px; }
    .player-key span { display:inline-flex; align-items:center; gap:7px; }
    .player-label { width:max-content; max-width:100%; padding:5px 10px; border:1px solid var(--player); border-radius:5px; background:color-mix(in srgb, var(--player) 10%, white); color:var(--player); font-weight:800; font-size:12px; line-height:1.2; }
    .dot { width:10px; height:10px; border-radius:50%; flex:0 0 auto; }
    section { background:#fff; border-bottom:1px solid var(--line); }
    section:nth-of-type(even) { background:#f8f9fa; }
    .section-inner { padding:30px 0 34px; }
    h2 { margin:0 0 20px; font-size:18px; line-height:1.35; }
    .rank-legend { display:flex; gap:16px; flex-wrap:wrap; margin:-8px 0 18px; color:var(--muted); font-size:12px; }
    .rank-legend span::before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; background:var(--rank); }
    .rank-legend span:nth-child(1) { --rank:#e3a51a; }.rank-legend span:nth-child(2) { --rank:#3b91b8; }
    .rank-legend span:nth-child(3) { --rank:#8b929a; }.rank-legend span:nth-child(4) { --rank:#cf5560; }
    .rank-grid { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:14px; }
    .rank-card { background:var(--paper); border:1px solid var(--line); border-top:4px solid var(--player); border-radius:6px; padding:18px 14px 15px; min-width:0; }
    .rank-name { font-size:14px; text-align:center; margin:0 auto 13px; padding:6px 15px; }
    .donut-wrap { position:relative; width:150px; height:150px; margin:0 auto; }
    .donut { width:150px; height:150px; border-radius:50%; background:var(--pie); position:relative; }
    .donut::after { content:""; position:absolute; inset:31px; border-radius:50%; background:#fff; box-shadow:0 0 0 1px var(--line); }
    .donut-center { position:absolute; inset:0; z-index:1; display:grid; place-content:center; text-align:center; pointer-events:none; }
    .donut-center strong { font-size:27px; line-height:1; }.donut-center small { color:var(--muted); margin-top:6px; }
    .rank-counts { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin-top:15px; text-align:center; }
    .rank-counts strong { display:block; font-size:15px; }.rank-counts small { color:var(--muted); font-size:11px; }
    .summary-strip { display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--line); border-radius:6px; overflow:hidden; margin-top:20px; }
    .summary-item { padding:14px 16px; border-right:1px solid var(--line); background:#fff; }

    .summary-item strong { font-size:20px; color:var(--player); }

    .compare-head > div, .metric-row > div { padding:11px 13px; border-right:1px solid var(--line); }
    .compare-head > div:last-child, .metric-row > div:last-child { border-right:0; }
    .metric-row { border-bottom:1px solid #eaedef; align-items:center; min-height:58px; }.metric-row:last-child { border-bottom:0; }
    .metric-label { font-size:13px; font-weight:700; }
    .bar-cell { position:relative; min-width:0; }.bar-track { height:7px; border-radius:4px; background:#e8ebed; overflow:hidden; margin-top:7px; }
    .bar-fill { height:100%; background:var(--player); border-radius:4px; min-width:0; }
    .bar-value { font-variant-numeric:tabular-nums; }
    .bar-value strong { font-size:14px; }
    .rating-table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); table-layout:fixed; }
    .rating-table th, .rating-table td { padding:14px 16px; border-bottom:1px solid var(--line); border-right:1px solid var(--line); text-align:right; }
    .rating-table th:first-child, .rating-table td:first-child { text-align:left; width:180px; }.rating-table th:last-child, .rating-table td:last-child { border-right:0; }
    .rating-table tr:last-child td { border-bottom:0; }.rating-table th { background:#f5f7f8; font-size:12px; }
    .rating-table td { font-size:16px; font-weight:750; }
    .source-table { width:100%; border-collapse:collapse; font-size:12px; }.source-table th, .source-table td { padding:9px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
    .source-table th { color:var(--muted); font-weight:650; }.source-table a { color:#315e9b; text-decoration:none; }.source-url { color:#4e5963; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; }.source-wrap { overflow-x:auto; }
    footer { color:var(--muted); font-size:11px; padding:20px; text-align:center; }
    @media (max-width:900px) {
      .rank-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }.summary-strip { grid-template-columns:repeat(2,1fr); }
      .summary-item:nth-child(2) { border-right:0; }.summary-item:nth-child(-n+2) { border-bottom:1px solid var(--line); }
    }
    @media (max-width:560px) {
      .header-inner, .section-inner { width:min(100% - 24px,1180px); }.header-inner { min-height:104px; align-items:flex-start; flex-direction:column; justify-content:center; gap:6px; }
      .meta { text-align:left; }h1 { font-size:22px; }.rank-grid { grid-template-columns:1fr; }
      .rank-card { display:grid; grid-template-columns:120px 1fr; align-items:center; padding:14px; }.rank-name { grid-column:1/-1; margin-bottom:8px; }

      .rank-counts { margin:0 0 0 10px; grid-template-columns:repeat(2,1fr); row-gap:12px; }
      .comparison { min-width:0; }.compare-head { display:none; }
      .metric-row { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); min-height:0; }
      .metric-row > div { border-right:1px solid var(--line); }.metric-row > div:nth-child(odd) { border-right:0; }
      .metric-label { grid-column:1/-1; border-right:0 !important; border-bottom:1px solid var(--line); background:#f5f7f8; padding:9px 11px !important; }
      .bar-cell { padding:10px 11px 12px !important; }.bar-cell::before { content:attr(data-player); display:block; color:var(--player); font-size:10px; font-weight:800; margin-bottom:5px; }
      .rating-table th, .rating-table td { padding:11px 8px; font-size:12px; }.rating-table th:first-child, .rating-table td:first-child { width:112px; }
